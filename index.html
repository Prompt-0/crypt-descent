<!DOCTYPE html>
<html lang="en" class="h-full w-full overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><text y='20' font-size='20'>💀</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Crypt Descent - Dark Fantasy Turn-Based Roguelike</title>
    <!-- Fonts: Cinzel & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=JetBrains+Mono:wght@400;600;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-dungeon-darkest text-slate-100 antialiased h-screen w-screen overflow-hidden flex flex-col font-sans select-none">
    <div id="app" class="relative w-full h-full flex flex-col overflow-hidden">
      <!-- HEADER BAR -->
      <header id="hud-top-bar" class="h-14 border-b border-dungeon-border bg-dungeon-darker/90 backdrop-blur px-5 flex items-center justify-between z-20 shrink-0"></header>

      <!-- MAIN PLAY AREA (Canvas Viewport + Fixed Sidebar) -->
      <div class="flex-1 flex overflow-hidden relative">
        <!-- CANVAS CONTAINER (Fills space, responsive) -->
        <main id="canvas-container" class="flex-1 relative bg-dungeon-darkest flex items-center justify-center overflow-hidden">
          <canvas id="game-canvas" class="block w-full h-full"></canvas>

          <!-- TARGETING BANNER OVERLAY -->
          <div id="targeting-overlay" class="absolute top-4 left-1/2 -translate-x-1/2 z-30 pointer-events-none hidden animate-bounce"></div>
        </main>

        <!-- RIGHT SIDEBAR (Fixed 340px Width, Viewport Locked) -->
        <aside id="hud-sidebar" class="w-[340px] border-l border-dungeon-border bg-dungeon-darker/95 backdrop-blur z-20 flex flex-col shrink-0 h-full overflow-hidden"></aside>
      </div>

      <!-- MODALS CONTAINER -->
      <div id="hud-modals" class="relative z-50"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
