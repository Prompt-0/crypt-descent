<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💀</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crypt Descent - Dark Fantasy Roguelike</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-dungeon-darkest text-dungeon-bone font-mono select-none overflow-hidden h-screen w-screen flex flex-col m-0 p-0">
    <div id="app" class="flex-1 flex flex-col h-full w-full overflow-hidden">
      <!-- TOP HEADER BAR -->
      <header id="hud-top-bar" class="h-14 bg-dungeon-darker border-b border-dungeon-border px-4 flex items-center justify-between text-sm shadow-md z-10 select-none"></header>

      <!-- MAIN GAME AREA -->
      <main class="flex-1 flex overflow-hidden relative">
        <!-- CANVAS CONTAINER (PERMANENT) -->
        <div id="canvas-container" class="flex-1 relative bg-dungeon-darkest flex items-center justify-center overflow-hidden">
          <canvas id="game-canvas" class="block cursor-crosshair"></canvas>
          <div id="targeting-overlay" class="absolute top-4 left-1/2 transform -translate-x-1/2 hidden z-20"></div>
        </div>

        <!-- SIDEBAR HUD -->
        <aside id="hud-sidebar" class="w-80 bg-dungeon-darker border-l border-dungeon-border flex flex-col justify-between overflow-y-auto z-10 select-none"></aside>
      </main>

      <!-- MODAL OVERLAY CONTAINER -->
      <div id="hud-modals" class="z-50"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
